<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi app">
  <meta name="theme-color" content="#000000">
  <script>
    // Tema antes de pintar nada, para que no haya destellos (oscuro | claro | auto)
    (function () {
      var t = "oscuro"; try { t = localStorage.getItem("hiperapp-tema") || "oscuro"; } catch (e) {}
      if (t === "auto") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro";
      document.documentElement.dataset.tema = t;
      if (t === "claro") {
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F3F2EF");
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", "default");
      }
    })();
  </script>
  <title>Mi app</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="icon" href="icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Navegación: barra lateral fija en el ordenador, menú desplegable en el móvil -->
    <nav class="menu" id="menu" aria-label="Secciones">
      <div class="menu-marca">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <g stroke="#000" stroke-width="1" stroke-linejoin="round">
            <polygon points="12,12 12,2.5 20.2,7.25" fill="#BF5AF2"/><polygon points="12,12 20.2,7.25 20.2,16.75" fill="#30D158"/>
            <polygon points="12,12 20.2,16.75 12,21.5" fill="#FFD60A"/><polygon points="12,12 12,21.5 3.8,16.75" fill="#FF9F0A"/>
            <polygon points="12,12 3.8,16.75 3.8,7.25" fill="#0A84FF"/><polygon points="12,12 3.8,7.25 12,2.5" fill="#C49A6C"/>
          </g>
        </svg>
        <span>Mi app</span>
      </div>
      <div id="menuLista"></div>
      <div class="menu-pie">
        <div class="menu-tema" role="group" aria-label="Tema">
          <button data-tema-op="oscuro"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Oscuro</button>
          <button data-tema-op="claro"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>Claro</button>
          <button data-tema-op="auto">Auto</button>
        </div>
        <button class="nube-estado" id="btnNube"><i></i><span id="nubeTexto">Solo en este dispositivo</span></button>
        <button class="menu-copias" id="btnCopias">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          <span>Ajustes y copias</span>
        </button>
      </div>
    </nav>
    <div class="menu-fondo" id="menuFondo"></div>

    <div class="cuerpo">
      <header class="top">
        <button class="menu-btn" id="btnMenu" aria-label="Abrir menú" aria-controls="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8h16M4 16h10"/></svg>
        </button>
        <div class="top-titulos">
          <span class="top-icono" id="tituloIcono" aria-hidden="true"></span>
          <div class="top-sup" id="supertitulo"></div>
          <h1 id="titulo">Mi app</h1>
        </div>
        <button class="nube-punto" id="btnNubeTop" aria-label="Estado de la nube"><i></i></button>
        <button class="icono-btn tema-btn" id="btnTema" aria-label="Cambiar entre tema claro y oscuro">
          <svg class="luna" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="sol" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
        <button class="icono-btn" id="btnAjustes" aria-label="Ajustes y copias de seguridad">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        </button>
      </header>
      <!-- Barra compacta que aparece al desplazarte hacia abajo (solo en el móvil) -->
      <div class="barra-mini" id="barraMini" aria-hidden="true">
        <button class="menu-btn" data-abrir-menu tabindex="-1" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8h16M4 16h10"/></svg>
        </button>
        <span class="bm-icono" id="bmIcono"></span><b id="bmTitulo"></b>
      </div>
      <main id="contenido"></main>
    </div>
  </div>

  <!-- Núcleo: guardado (en el dispositivo y en la nube), copias de seguridad y navegación -->
  <script src="app.js"></script>
  <!-- Una línea por pantalla. El orden del menú lo marcan los grupos de app.js. -->
  <script src="tabs/vida.js"></script>
  <script src="tabs/habitos.js"></script>
  <script src="tabs/estudio.js"></script>
  <script src="tabs/patrimonio.js"></script>
  <script src="tabs/inversiones.js"></script>
  <script src="tabs/value.js"></script>
  <script src="tabs/alimentacion.js"></script>
  <script src="tabs/gimnasio.js"></script>
  <script src="tabs/ocio.js"></script>
  <script src="tabs/viajes.js"></script>
  <script>HiperApp.iniciar();</script>
</body>
</html>
